# Local development services.
#
#   docker compose up -d db                      # the database (npm run db:up)
#   docker compose --profile tools up -d pgadmin # optional: pgAdmin in the browser
#   docker compose --profile tools up -d mailpit # optional: a local inbox for email
#
# These passwords are for local development only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dua
      POSTGRES_PASSWORD: dua
      POSTGRES_DB: dua
    ports:
      # 54329 on your machine, so it doesn't clash with a local Postgres on 5432.
      - "54329:5432"
    volumes:
      - dua-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dua -d dua"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The app itself. `docker compose up -d --build` starts the database and the
  # app; `npm run db:up` still starts only the database for host development.
  #
  # The defaults are for local development only. Set ADMIN_PASSWORD,
  # SUBMISSION_EDIT_SECRET and DEMO_MODE in the shell (or a .env file) before
  # using this for anything beyond a local demo.
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgres://dua:dua@db:5432/dua
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo-admin-password}
      SUBMISSION_EDIT_SECRET: ${SUBMISSION_EDIT_SECRET:-local-compose-secret-change-me}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # A web UI for browsing the database, at http://localhost:5050.
  # Only starts when you ask for the "tools" profile.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.org
      PGADMIN_DEFAULT_PASSWORD: dua
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dua-pgadmin:/var/lib/pgadmin

  # Catches every email the app sends and shows it at http://localhost:8025,
  # so you can try email features without sending anything for real.
  # Use it by setting SMTP_URL=smtp://localhost:1025 in .env.local.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["tools"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dua-db:
  dua-pgadmin:
